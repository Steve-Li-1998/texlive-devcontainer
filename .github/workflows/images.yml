name: images

# Builds the ci and dev images, compiles a test document in the dev image and pushes both to
# ghcr.io. Versions come from docker-bake.hcl (keep the Dockerfile's ARG defaults in sync).
on:
  workflow_dispatch:
    inputs:
      reuse_base:
        description: "Reuse the published texlive-ci:latest as the base (off: reinstall TeX Live, about 20 min)"
        type: boolean
        default: true
      push:
        description: "Push the images (off: build and test only)"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: images
  cancel-in-progress: false

env:
  CI_IMAGE: ghcr.io/steve-li-1998/texlive-ci
  REUSE_BASE: ${{ inputs.reuse_base }}
  PUSH: ${{ inputs.push }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      # A full build needs well over the runner's free space: TeX Live alone is 18 GB
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
      - run: df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Reusing the base keeps its TeX Live, so the version tag keeps its install date: the
      # date of the texlive<year>.<date>-... tag that points at the same image as latest
      - name: Use the published base
        if: env.REUSE_BASE == 'true'
        run: |
          digest() { docker buildx imagetools inspect "$1" | awk '/^Digest:/ {print $2; exit}'; }
          latest=$(digest "$CI_IMAGE:latest")
          token=$(curl -fsSL "https://ghcr.io/token?scope=repository:${CI_IMAGE#ghcr.io/}:pull" | jq -r .token)
          date=
          for tag in $(curl -fsSL -H "Authorization: Bearer $token" "https://ghcr.io/v2/${CI_IMAGE#ghcr.io/}/tags/list" \
                         | jq -r '.tags[]' | grep -E '^texlive[0-9]{4}\.[0-9]{8}-'); do
            if [ "$(digest "$CI_IMAGE:$tag")" = "$latest" ]; then
              date=$(echo "$tag" | sed -E 's/^texlive[0-9]{4}\.([0-9]{8})-.*/\1/')
              break
            fi
          done
          [ -n "$date" ] || { echo "::error::No dated tag points at $CI_IMAGE:latest"; exit 1; }
          echo "Reusing $CI_IMAGE:latest ($latest), TeX Live installed on $date"
          echo "TEXLIVE_DATE=$date" >> "$GITHUB_ENV"
          echo "BASE_IMAGE=$CI_IMAGE@$latest" >> "$GITHUB_ENV"

      - name: Build and test
        run: docker buildx bake --progress=plain ${BASE_IMAGE:+--set "*.contexts.base=docker-image://$BASE_IMAGE"} smoketest

      - name: Push
        if: env.PUSH == 'true'
        run: docker buildx bake --progress=plain ${BASE_IMAGE:+--set "*.contexts.base=docker-image://$BASE_IMAGE"} --push ci dev

      - name: Summary
        if: env.PUSH == 'true'
        run: |
          for image in texlive-ci texlive-devcontainer; do
            docker buildx imagetools inspect "ghcr.io/steve-li-1998/$image:latest" | awk -v i="$image" '/^Digest:/ {print i, $2; exit}'
          done | tee -a "$GITHUB_STEP_SUMMARY"
